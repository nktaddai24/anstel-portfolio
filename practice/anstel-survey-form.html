<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>ANSTEL SURVEY FORM</title>
    </head>
    <body>
        <header>
            <h1 id="title">ANSTEL Customer Survey</h1>
            <p id="description">Welcome to ANSTEL Barbershop, this survey form is to inquire from customers their satisfaction levels with our service.</p>
        </header>
        <main>
            <form id="survey-form">
                <div>
                    <label for="name">Full Name:</label>
                    <input id="name" type="text" name="name" placeholder="Addai Nketiah">
                </div><br>
                <div>
                    <label for="email">Email Address</label>
                    <input id="email" type="email" name="email" placeholder="example@email.com">
                </div><br>
                <div>
                    <label for="number">Telephone Number</label>
                    <input id="number" type="number" name="number" min="6" max="100" placeholder="0249675990">
                </div><br>
                <div>
                    <select id="dropdown">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>
            </form>
        </main>
    </body>
    <footer></footer>
</html>
